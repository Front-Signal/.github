name: "4. Defect, Extraction & Isolation Bug Report"
description: "Report a functional bug, extraction quality issue, or tenant isolation defect."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: "Affected System Layer"
      options:
        - "1. Access (Portal / Auth)"
        - "2. Secure Ingestion"
        - "3. Background Processing / Extraction"
        - "4. Private Storage / PostgreSQL RLS"
        - "5. Shared Product Services (Score / Compare)"
        - "6. Authorized Delivery / Reporting"
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: "Observed Defect"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
    validations:
      required: true
  - type: textarea
    id: lineage
    attributes:
      label: "Traceability & Lineage Context (if applicable)"
      placeholder: "- Tenant ID:\n- Submission Version:\n- Analysis Run / Config Revision:\n- Rubric / Model Version:"
